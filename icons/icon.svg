<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14f195"/>
      <stop offset="100%" stop-color="#9945ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#brandGrad)" stroke-width="6" opacity="0.4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Center Card / Wallet Badge -->
  <rect x="116" y="146" width="280" height="220" rx="36" fill="url(#cardGrad)" stroke="#334155" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Card Header Line / Magnetic Strip Glow -->
  <path d="M 116 196 L 396 196" stroke="#1e293b" stroke-width="12"/>

  <!-- Solana & Lightning Symbol in Center -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Lightning Bolt -->
    <path d="M -12 -58 L 22 -58 L 2 -12 L 26 -12 L -22 62 L -8 6 L -32 6 Z" fill="url(#brandGrad)" filter="url(#glow)"/>
  </g>

  <!-- MicroPay text badge -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#f8fafc" letter-spacing="3">
    MICROPAY
  </text>
  <text x="256" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#10b981" letter-spacing="2">
    SOLANA • GIFT CARDS
  </text>
</svg>
